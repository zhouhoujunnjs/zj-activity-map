    var map = this;
    window.商户地图 = map;

        navigator.geolocation.getCurrentPosition(
            function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                map.setView([lat, lng],14);
                let userMarker = L.circleMarker([lat, lng],{
                    color:'#007bff',
                    fillColor:'#007bff',
                    fillOpacity:0.9,
                    radius:10
                }).addTo(map);
                userMarker.bindPopup("<b>📍我的当前位置</b>").openPopup();
            },
            function(error){
                console.log("定位失败/拒绝授权，error code:",error.code);
            },
            {enableHighAccuracy:true,timeout:8000,maximumAge:0}
        );
    }
});
</script>

function searchShop(){
    let keyword = document.getElementById("shopSearchInput").value.trim().toLowerCase();
    if(!keyword){
        alert("请输入店铺名称");
        return;
    }
    // 模糊匹配
    let result = shopData.find(shop => shop.店铺名称.toLowerCase().includes(keyword));
    if(result){
        window.商户地图.setView([result.wgs84_lat, result.wgs84_lon],16);
        L.popup().setLatLng([result.wgs84_lat, result.wgs84_lon])
            .setContent("<b>"+result.店铺名称+"</b>")
            .openOn(window.商户地图);
    }else{
        alert("无此合作店铺");
    }
}
// 回车直接搜索
document.addEventListener("keydown",function(e){
    if(e.key === "Enter"){
        searchShop();
    }
})
