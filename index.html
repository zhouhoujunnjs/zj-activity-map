    window['商户地图'] = map;

    /* 矢量底图 + 注记（旧版把矢量层重复加载了一次，这里只留一份，省一半瓦片） */
    var base = makeLayer('vec', {
      minZoom: 0, maxZoom: 18, maxNativeZoom: 18,
      subdomains: SUBDOMAINS, detectRetina: false, tms: false, opacity: 1,
      attribution: '天地图 | 该地图仅供农行内部员工测试使用',
      errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'
    }).addTo(map);

    var anno = makeLayer('cva', {
      minZoom: 0, maxZoom: 18, maxNativeZoom: 18,
      subdomains: SUBDOMAINS, detectRetina: false, tms: false, opacity: 1,
      attribution: '天地图注记',
      errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'
    }).addTo(map);

    base.once('tileload', function () { tilesReady = true; hideTipSoon(); });

    /* 图钉：分批创建，每批 60 个，避免一次性建 377 个节点卡住首屏 */
    var pending = SHOPS.slice();
    function addMarker(s) {
      var mk = L.marker([s.a, s.o], {
        icon: L.divIcon({
          className: 'shop-pin',
          html: pinHtml(s.c),
          iconSize: [30, 40],
          iconAnchor: [15, 40],
          popupAnchor: [0, -36]
        }),
        title: s.n,
        riseOnHover: true
      }).addTo(map);
      mk.bindPopup(popupHtml(s), { maxWidth: 250, minWidth: 240, autoPan: true });
    }
    function addChunk() {
      var n = Math.min(60, pending.length);
      for (var i = 0; i < n; i++) { addMarker(pending.shift()); }
      if (pending.length) { setTimeout(addChunk, 16); }
    }
    addChunk();

    /* 底部版权行：只保留一行说明，去掉重复的那句，字号 11px 不换行 */
    map.attributionControl.setPrefix(false);

    /* 尺寸自愈：微信首屏高度常为 0，这里反复兜几次 */
    resizeNow();
    [80, 300, 800, 1600, 3000].forEach(function (t) { setTimeout(resizeNow, t); });
    window.addEventListener('resize', resizeNow, false);
    window.addEventListener('orientationchange', function () { setTimeout(resizeNow, 250); }, false);
    window.addEventListener('pageshow', function () { setTimeout(resizeNow, 60); }, false);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) { setTimeout(resizeNow, 120); }
    }, false);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () { setTimeout(resizeNow, 80); });
    }

    /* 底图长时间不出现时给一句提示，而不是干等白屏 */
    setTimeout(function () {
      if (!tilesReady) { tip('底图加载较慢或失败，可下拉刷新或切换网络', 6000); }
    }, 9000);

    /* 自动定位一次：底图出来后再触发，避免一进页面就弹授权框 */
    var locateAsked = false;
    function autoLocate() {
      if (locateAsked) { return; }
      locateAsked = true;
      if (map) { locateMe(); }
    }
    base.once('tileload', function () { setTimeout(autoLocate, 400); });
    setTimeout(autoLocate, 2600);   /* 瓦片慢或失败时的兜底触发 */
  }
  /* 打开页面后自动定位一次（底图出来后约 0.4 秒触发，用户先看到地图再看到授权框）；
     用户之后还可点右下角 📍 按钮重新定位。 */

  function hideTipSoon() {
    var bar = document.getElementById('tipbar');
    if (bar) { bar.style.display = 'none'; }
  }

  function locateMe() {
    if (!navigator.geolocation) {
      tip('当前浏览器不支持定位', 4000);
      return;
    }
    tip('正在定位…', 8000);
    navigator.geolocation.getCurrentPosition(function (pos) {
      var lat = pos.coords.latitude, lng = pos.coords.longitude;
      if (!lat || !lng) { return; }
      map.setView([lat, lng], 14);
      var dot = L.circleMarker([lat, lng], {
        color: '#007bff', fillColor: '#007bff', fillOpacity: 0.9, radius: 9, weight: 2
      }).addTo(map);
      dot.bindPopup('<b>📍我当前位置</b>').openPopup();
      setTimeout(resizeNow, 200);
    }, function (err) {
      tip('定位失败：请允许定位权限后重试', 5000);
    }, {
      /* 不申请"精确定位"：iOS 的授权弹窗会因此少一行说明，且商场内也够用 */
      enableHighAccuracy: false, timeout: 6000, maximumAge: 60000
    });
  }

  document.getElementById('btnLocate').addEventListener('click', function () {
    if (!map) { showFallback('地图尚未就绪，请稍候或刷新重试。'); return; }
    locateMe();
  });

  /* ---- 搜索 ---- */
  function searchShop() {
    var input = document.getElementById('shopSearchInput');
    var kw = (input.value || '').trim().toLowerCase();
    if (!kw) { alert('请输入店铺名称'); return; }
    var hit = null, hitCount = 0;
    for (var i = 0; i < SHOPS.length; i++) {
      if (SHOPS[i].n.toLowerCase().indexOf(kw) > -1) {
        hitCount++;
        if (!hit) { hit = SHOPS[i]; }
      }
    }
    if (!hit) { alert('无此合作店铺'); return; }
    if (!map) { showFallback('地图尚未就绪，请稍候或刷新重试。'); return; }
    map.setView([hit.a, hit.o], 16);
    setTimeout(function () {
      L.popup().setLatLng([hit.a, hit.o]).setContent(popupHtml(hit)).openOn(map);
      if (hitCount > 1) { tip('共找到 ' + hitCount + ' 家，已定位到「' + hit.n + '」', 3000); }
    }, 250);
  }

  document.getElementById('btnSearch').addEventListener('click', searchShop);
  document.getElementById('shopSearchInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.keyCode === 13) { e.preventDefault(); searchShop(); }
  });
  document.getElementById('btnReload').addEventListener('click', function () { location.reload(); });

  /* 兜底：任何脚本异常都给出可读提示，不再白屏 */
  window.onerror = function (msg) {
    if (!map) { showFallback('页面脚本出错（' + msg + '）。<br>请点右上角“…” → <b>在浏览器打开</b>。'); }
    return false;
  };

  /* 先让浏览器把悬浮面板画出来，再初始化地图（体感更快） */
  setTimeout(function () {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initMap, false);
    } else {
      initMap();
    }
  }, 0);
})();
</script>
</body>
</html>
